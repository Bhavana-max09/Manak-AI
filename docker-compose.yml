services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manak-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./manak_ai.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: manak-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
